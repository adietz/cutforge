[[permission]]
identifier = "allow-serial"
description = "USB serial, Silhouette USB, Wi‑Fi TCP, and vector import helpers"
commands.allow = [
  "list_serial_ports",
  "serial_connect",
  "serial_disconnect",
  "serial_is_connected",
  "serial_write_line",
  "serial_cancel_job",
  "serial_home",
  "serial_jog",
  "serial_send_gcode",
  "list_silhouette_devices",
  "silhouette_send_gpgl",
  "grbl_tcp_send",
  "vector_helper_status",
  "convert_vector_to_svg",
]
