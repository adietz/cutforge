[[permission]]
identifier = "allow-serial"
description = "USB serial (IKIER K1 GRBL) and Silhouette Graphtec USB"
commands.allow = [
  "list_serial_ports",
  "serial_connect",
  "serial_disconnect",
  "serial_is_connected",
  "serial_write_line",
  "serial_cancel_job",
  "serial_home",
  "serial_jog",
  "serial_send_gcode",
  "list_silhouette_devices",
  "silhouette_send_gpgl",
]
