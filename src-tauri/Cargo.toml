[package]
name = "cutforge"
version = "1.8.5"
description = "CutForge — vector design for laser cutting and Silhouette"
authors = ["Andy Dietz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cutforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serialport = { version = "4.6", default-features = false }
once_cell = "1.19"
rusb = "0.9"
