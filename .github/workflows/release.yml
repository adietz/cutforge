# Build CutForge installers and attach them to a GitHub Release.
# Triggers: push of tags matching v* (e.g. v1.6.0), or manual Run workflow.
#
# Unsigned Mac/Windows builds are intentional for v1 — see README.
# Later: add Apple/Windows signing secrets and TAURI_SIGNING_* for updater.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Prefer the pushed tag; otherwise create/use v__VERSION__ from tauri.conf / package.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: CutForge ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ## CutForge desktop installers

            Download the asset for your OS below.

            | Platform | Typical asset |
            |----------|----------------|
            | macOS Apple Silicon | `.dmg` / `aarch64.app.tar.gz` |
            | macOS Intel | `.dmg` / `x64.app.tar.gz` |
            | Windows | NSIS `.exe` installer / `.msi` |
            | Linux | `.AppImage` / `.deb` |

            **Unsigned builds (v1):** Gatekeeper (macOS) and SmartScreen (Windows) may warn.
            See the README section *Install from GitHub Releases*. No Apple/Windows code-signing
            certificates are configured in CI yet.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
